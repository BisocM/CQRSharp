name: Release (NuGet)

on:
  push:
    branches: [ Release ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run build/validation only (do not publish to NuGet)"
        type: boolean
        required: false
        default: false

concurrency:
  group: nuget-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  NUGET_SOURCE: https://api.nuget.org/v3/index.json
  PACKAGE_OUTPUT: artifacts/packages

jobs:
  # The full gate (see validate.yml). Its `nuget-packages` artifact - built, tested and validated there - is what
  # gets published below; nothing is rebuilt in between.
  validate:
    name: Validate
    uses: ./.github/workflows/validate.yml

  publish:
    name: Publish
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write  # mint the GitHub OIDC token for NuGet Trusted Publishing (keyless publish)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the advisory review reads the commit subjects since the last release

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ${{ env.PACKAGE_OUTPUT }}

      - name: Validate packages and check NuGet for this version
        id: validate
        # Re-checks the downloaded packages and asks nuget.org whether this version is new. A push to Release that did
        # not change the version leaves should_publish=false and every step below is skipped.
        run: python3 .github/scripts/validate_packages.py "${{ env.PACKAGE_OUTPUT }}" --check-nuget

      - name: LLM pre-publish review (bisocm, advisory)
        # Run when a publish will actually happen (new version) or on any manual dispatch, so dry runs still get the
        # review but a Release push that did not change the version doesn't burn bisocm calls.
        if: ${{ steps.validate.outputs.should_publish == 'true' || github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        env:
          BISOCM_API_KEY: ${{ secrets.BISOCM_API_KEY }}
        run: python3 .github/scripts/llm_review.py

      - name: NuGet login (OIDC -> short-lived key, Trusted Publishing)
        # Exchanges the GitHub OIDC token for a 1-hour nuget.org key. Run immediately before the push (the key expires)
        # and only when a publish will actually happen.
        if: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/Release') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) && steps.validate.outputs.should_publish == 'true' }}
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: BisocM  # nuget.org username (profile name) the Trusted Publishing policy is configured for

      - name: Publish to NuGet.org
        if: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/Release') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) && steps.validate.outputs.should_publish == 'true' }}
        # Pushing a .nupkg also pushes the .snupkg next to it. --skip-duplicate completes a partially published version.
        run: |
          for pkg in "${{ env.PACKAGE_OUTPUT }}"/*.nupkg; do
            dotnet nuget push "${pkg}" \
              --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
              --source "${{ env.NUGET_SOURCE }}" \
              --skip-duplicate
          done
