name: Release (NuGet)

on:
  push:
    branches: [ Release ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run build/validation only (do not publish to NuGet)"
        type: boolean
        required: false
        default: false

concurrency:
  group: nuget-release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write  # mint the GitHub OIDC token for NuGet Trusted Publishing (keyless publish)

env:
  CONFIGURATION: Release
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  NUGET_SOURCE: https://api.nuget.org/v3/index.json
  PACKAGE_OUTPUT: artifacts/packages
  TEST_RESULTS: artifacts/test-results
  AOT_OUTPUT: artifacts/aot

jobs:
  build-validate-publish:
    name: Build, validate, publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # A Redis service so the CQRSharp.Redis outbox-store contract tests run for real in CI. The test fixture connects to
    # localhost:6379 by default; without a reachable server those tests skip cleanly instead of failing.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            nuget.config

      - name: Preflight (install prerequisites if missing)
        run: |
          echo "Runner: $(uname -a)"
          echo
          
          need_clang=0
          need_zlib=0
          need_python=0

          if ! command -v clang >/dev/null; then need_clang=1; fi
          if [ ! -f /usr/include/zlib.h ]; then need_zlib=1; fi
          if ! command -v python3 >/dev/null; then need_python=1; fi

          if [ "${need_clang}" -eq 1 ] || [ "${need_zlib}" -eq 1 ] || [ "${need_python}" -eq 1 ]; then
            echo "Installing missing prerequisites..."

            if command -v sudo >/dev/null; then
              SUDO="sudo"
            else
              SUDO=""
            fi

            if command -v apt-get >/dev/null; then
              ${SUDO} apt-get update
              ${SUDO} apt-get install -y \
                $( [ "${need_clang}" -eq 1 ] && echo "clang" ) \
                $( [ "${need_zlib}" -eq 1 ] && echo "zlib1g-dev" ) \
                $( [ "${need_python}" -eq 1 ] && echo "python3" )
            elif command -v dnf >/dev/null; then
              ${SUDO} dnf install -y \
                $( [ "${need_clang}" -eq 1 ] && echo "clang" ) \
                $( [ "${need_zlib}" -eq 1 ] && echo "zlib-devel" ) \
                $( [ "${need_python}" -eq 1 ] && echo "python3" )
            elif command -v yum >/dev/null; then
              ${SUDO} yum install -y \
                $( [ "${need_clang}" -eq 1 ] && echo "clang" ) \
                $( [ "${need_zlib}" -eq 1 ] && echo "zlib-devel" ) \
                $( [ "${need_python}" -eq 1 ] && echo "python3" )
            elif command -v apk >/dev/null; then
              ${SUDO} apk add --no-cache \
                $( [ "${need_clang}" -eq 1 ] && echo "clang" ) \
                $( [ "${need_zlib}" -eq 1 ] && echo "zlib-dev" ) \
                $( [ "${need_python}" -eq 1 ] && echo "python3" )
            elif command -v zypper >/dev/null; then
              ${SUDO} zypper --non-interactive install \
                $( [ "${need_clang}" -eq 1 ] && echo "clang" ) \
                $( [ "${need_zlib}" -eq 1 ] && echo "zlib-devel" ) \
                $( [ "${need_python}" -eq 1 ] && echo "python3" )
            else
              echo "No supported package manager found (apt-get/dnf/yum/apk/zypper). Install clang + zlib headers + python3 on the runner."
              exit 1
            fi
          fi

          clang --version
          python3 --version

          if [ ! -f /usr/include/zlib.h ]; then
            echo "zlib headers are still missing after install attempt."
            exit 1
          fi

          dotnet --info

      - name: Restore
        run: dotnet restore CQRSharp.sln

      - name: Build (zero-warning gate)
        # -warnaserror makes the compiler/MSBuild fail the build on ANY warning, so the step's exit code is the gate
        # (no fragile, locale-dependent log scraping). A clean NuGet publish requires zero warnings.
        run: dotnet build CQRSharp.sln -c ${{ env.CONFIGURATION }} --no-restore /p:ContinuousIntegrationBuild=true /p:GeneratePackageOnBuild=false -warnaserror

      - name: Test
        run: dotnet test tests/CQRSharp.Tests/CQRSharp.Tests.csproj -c ${{ env.CONFIGURATION }} --no-build --logger "trx;LogFileName=test_results.trx" --results-directory ${{ env.TEST_RESULTS }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ env.TEST_RESULTS }}

      - name: Run Sample self-test (framework build)
        run: dotnet run --project src/Presentation/CQRSharp.Sample/CQRSharp.Sample.csproj -c ${{ env.CONFIGURATION }} -f net8.0 --no-build

      - name: NativeAOT publish Sample + run
        run: |
          set -eo pipefail
          rm -rf "${{ env.AOT_OUTPUT }}"
          mkdir -p "${{ env.AOT_OUTPUT }}"

          arch="$(uname -m)"
          case "${arch}" in
            x86_64) rid="linux-x64" ;;
            aarch64|arm64) rid="linux-arm64" ;;
            *)
              echo "Unsupported runner architecture for NativeAOT publish: ${arch}"
              exit 1
              ;;
          esac
          echo "NativeAOT RID: ${rid}"

          # The per-library trim/AOT analyzers (IsAotCompatible) already gate AOT-hostile code at build under
          # -warnaserror. This is the whole-graph backstop: capture the ILComp output and fail loud on any trim/AOT
          # (IL) warning attributed to CQRSharp library source (the path filter ignores dependency warnings).
          publish_log="$(mktemp)"
          dotnet publish src/Presentation/CQRSharp.Sample/CQRSharp.Sample.csproj \
            -c "${{ env.CONFIGURATION }}" \
            -f net8.0 \
            -r "${rid}" \
            -o "${{ env.AOT_OUTPUT }}" \
            /p:ContinuousIntegrationBuild=true \
            /p:GeneratePackageOnBuild=false 2>&1 | tee "${publish_log}"

          if grep -nE 'CQRSharp\.(Core|Pipelines|Abstractions|Redis)[^]]*: warning IL[0-9]{4}' "${publish_log}"; then
            echo "::error::Native AOT publish produced trim/AOT (IL) warnings in CQRSharp source (listed above)."
            exit 1
          fi

          "${{ env.AOT_OUTPUT }}/CQRSharp.Sample"

      - name: Pack NuGet packages
        run: |
          rm -rf "${{ env.PACKAGE_OUTPUT }}"
          mkdir -p "${{ env.PACKAGE_OUTPUT }}"

          dotnet pack src/Domain/CQRSharp.Abstractions/CQRSharp.Abstractions.csproj -c "${{ env.CONFIGURATION }}" --no-build --no-restore -o "${{ env.PACKAGE_OUTPUT }}" /p:ContinuousIntegrationBuild=true
          dotnet pack src/Domain/CQRSharp.Core/CQRSharp.Core.csproj -c "${{ env.CONFIGURATION }}" --no-build --no-restore -o "${{ env.PACKAGE_OUTPUT }}" /p:ContinuousIntegrationBuild=true
          dotnet pack src/Application/CQRSharp.Pipelines/CQRSharp.Pipelines.csproj -c "${{ env.CONFIGURATION }}" --no-build --no-restore -o "${{ env.PACKAGE_OUTPUT }}" /p:ContinuousIntegrationBuild=true
          dotnet pack src/Integrations/CQRSharp.Redis/CQRSharp.Redis.csproj -c "${{ env.CONFIGURATION }}" --no-build --no-restore -o "${{ env.PACKAGE_OUTPUT }}" /p:ContinuousIntegrationBuild=true
          dotnet pack src/Integrations/CQRSharp.EntityFrameworkCore/CQRSharp.EntityFrameworkCore.csproj -c "${{ env.CONFIGURATION }}" --no-build --no-restore -o "${{ env.PACKAGE_OUTPUT }}" /p:ContinuousIntegrationBuild=true
          dotnet pack src/Application/CQRSharp/CQRSharp.csproj -c "${{ env.CONFIGURATION }}" --no-build --no-restore -o "${{ env.PACKAGE_OUTPUT }}" /p:ContinuousIntegrationBuild=true

      - name: Validate package contents
        id: validate
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import glob
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET
          import zipfile

          package_dir = os.environ.get("PACKAGE_OUTPUT", "artifacts/packages")
          nuget_source = os.environ.get("NUGET_SOURCE", "https://api.nuget.org/v3/index.json")
          del nuget_source  # avoid unused; we use the flat container API directly

          packages = sorted(glob.glob(os.path.join(package_dir, "*.nupkg")))
          if not packages:
              raise SystemExit(f"No .nupkg files found in '{package_dir}'.")

          def parse_nuspec(z: zipfile.ZipFile):
              nuspec_paths = [n for n in z.namelist() if n.endswith(".nuspec")]
              if len(nuspec_paths) != 1:
                  raise ValueError(f"Expected 1 .nuspec file, found {len(nuspec_paths)}: {nuspec_paths}")
              nuspec_raw = z.read(nuspec_paths[0]).decode("utf-8-sig", errors="replace")
              root = ET.fromstring(nuspec_raw)
              ns = {"n": root.tag.split("}")[0].strip("{")} if "}" in root.tag else {}
              def find_text(path: str) -> str:
                  node = root.find(path, ns) if ns else root.find(path)
                  if node is None or node.text is None:
                      raise ValueError(f"Missing nuspec value for '{path}'")
                  return node.text.strip()
              return find_text("n:metadata/n:id" if ns else "metadata/id"), find_text("n:metadata/n:version" if ns else "metadata/version")

          def normalize_version(v: str) -> str:
              # Match NuGet normalization enough for the gate: drop +build-metadata and lowercase (prerelease is
              # case-insensitive), so the gate does not misfire on prerelease/+metadata versions.
              return v.strip().split("+", 1)[0].lower()

          def flatcontainer_versions(package_id: str) -> set[str]:
              url = f"https://api.nuget.org/v3-flatcontainer/{package_id.lower()}/index.json"
              try:
                  with urllib.request.urlopen(url, timeout=30) as resp:
                      raw = resp.read().decode("utf-8", errors="replace")
                      payload = json.loads(raw)
                      return {normalize_version(x) for x in payload.get("versions", [])}
              except urllib.error.HTTPError as ex:
                  if ex.code == 404:
                      return set()
                  raise

          ids = set()
          versions = set()
          observed = []

          for path in packages:
              with zipfile.ZipFile(path) as z:
                  package_id, version = parse_nuspec(z)
                  ids.add(package_id)
                  versions.add(version)
                  observed.append((package_id, version, path))

                  names = set(z.namelist())
                  if package_id == "CQRSharp":
                      if "analyzers/dotnet/cs/CQRSharp.Generators.dll" not in names:
                          raise SystemExit("CQRSharp meta-package must embed analyzers/dotnet/cs/CQRSharp.Generators.dll for plug-and-play.")
                      if "analyzers/dotnet/cs/CQRSharp.Analyzers.dll" not in names:
                          raise SystemExit("CQRSharp meta-package must embed analyzers/dotnet/cs/CQRSharp.Analyzers.dll for plug-and-play.")
                      if any(n.startswith("lib/") for n in names):
                          raise SystemExit("CQRSharp meta-package must NOT include lib/ outputs (meta-package).")

          expected_ids = {
              "CQRSharp.Abstractions",
              "CQRSharp.Core",
              "CQRSharp.Pipelines",
              "CQRSharp.Redis",
              "CQRSharp.EntityFrameworkCore",
              "CQRSharp",
          }

          missing = expected_ids - ids
          unexpected = ids - expected_ids
          if missing:
              raise SystemExit(f"Missing expected packages: {sorted(missing)}")
          if unexpected:
              raise SystemExit(f"Unexpected packages produced: {sorted(unexpected)}")

          if len(versions) != 1:
              raise SystemExit(f"Package versions are not aligned: {sorted(versions)}")
          version = next(iter(versions))

          existing = []
          for package_id, _, _ in observed:
              if normalize_version(version) in flatcontainer_versions(package_id):
                  existing.append(package_id)

          # Publish only when this version is genuinely new — i.e. at least one package does not yet have this
          # version on NuGet. A push to Release that did not change the version leaves every package already
          # published, so should_publish is false and the publish step is skipped.
          should_publish = len(existing) < len(observed)

          gh_output = os.environ.get("GITHUB_OUTPUT")
          if gh_output:
              with open(gh_output, "a", encoding="utf-8") as fh:
                  fh.write(f"should_publish={'true' if should_publish else 'false'}\n")
                  fh.write(f"package_version={version}\n")

          if existing:
              print(f"::warning::Version '{version}' already exists on NuGet for: {', '.join(sorted(existing))}")
          if not should_publish:
              print(f"::notice::Version '{version}' is already published for all packages; nothing to publish (no version change).")

          print(f"Validated {len(packages)} packages, version {version} (publish={should_publish}): {', '.join(sorted(ids))}")
          PY

      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ${{ env.PACKAGE_OUTPUT }}

      - name: LLM pre-publish review (bisocm, advisory)
        # Run when a publish will actually happen (new version) or on any manual dispatch, so dry runs still get the
        # review but a Release push that did not change the version doesn't burn bisocm calls.
        if: ${{ steps.validate.outputs.should_publish == 'true' || github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        env:
          BISOCM_API_KEY: ${{ secrets.BISOCM_API_KEY }}
        run: python3 .github/scripts/llm_review.py

      - name: NuGet login (OIDC -> short-lived key, Trusted Publishing)
        # Exchanges the GitHub OIDC token for a 1-hour nuget.org key. Run immediately before the push (the key expires)
        # and only when a publish will actually happen.
        if: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/Release') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) && steps.validate.outputs.should_publish == 'true' }}
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: BisocM  # nuget.org username (profile name) the Trusted Publishing policy is configured for

      - name: Publish to NuGet.org
        if: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/Release') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) && steps.validate.outputs.should_publish == 'true' }}
        run: |
          for pkg in "${{ env.PACKAGE_OUTPUT }}"/*.nupkg; do
            dotnet nuget push "${pkg}" \
              --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
              --source "${{ env.NUGET_SOURCE }}" \
              --skip-duplicate
          done
