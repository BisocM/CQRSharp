name: CI

# Validates a change BEFORE it reaches the Release branch, where the publish pipeline is the first thing to build it.
# Same gates as the release build (zero warnings, full test suite, Redis-backed contract tests); no packing, no publish.
on:
  pull_request:
  push:
    branches-ignore: [ Release ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CONFIGURATION: Release
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            nuget.config

      - name: Restore
        run: dotnet restore CQRSharp.sln

      - name: Build (zero-warning gate)
        run: dotnet build CQRSharp.sln -c ${{ env.CONFIGURATION }} --no-restore /p:ContinuousIntegrationBuild=true /p:GeneratePackageOnBuild=false -warnaserror

      - name: Test
        run: dotnet test tests/CQRSharp.Tests/CQRSharp.Tests.csproj -c ${{ env.CONFIGURATION }} --no-build --logger "trx;LogFileName=test_results.trx" --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results

      - name: Run Sample self-test
        run: dotnet run --project samples/CQRSharp.Sample/CQRSharp.Sample.csproj -c ${{ env.CONFIGURATION }} -f net8.0 --no-build
