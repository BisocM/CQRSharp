name: CI

# Validates a change BEFORE it reaches the Release branch. Runs the same gate the release pipeline runs (validate.yml:
# zero warnings, all three target frameworks, Redis-backed contract tests, Native AOT, pack + package validation, template
# smoke test) and additionally builds and tests on Windows and macOS. Nothing is published.
on:
  pull_request:
  push:
    branches-ignore: [ Release ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CONFIGURATION: Release
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate.yml

  cross-platform:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Build (zero-warning gate)
        run: dotnet build CQRSharp.sln -c ${{ env.CONFIGURATION }} -p:GeneratePackageOnBuild=false -warnaserror

      # Service containers are Linux-only, so there is no Redis here: the Redis contract tests skip (they run in the
      # validate job). Everything else - including the EF Core stores on SQLite - runs on every OS.
      - name: Test (net8.0, net9.0, net10.0)
        run: dotnet test tests/CQRSharp.Tests/CQRSharp.Tests.csproj -c ${{ env.CONFIGURATION }} --no-build --logger "trx" --results-directory artifacts/test-results --blame-hang-timeout 5m --blame-hang-dump-type none

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results

      - name: Run Sample self-test
        run: dotnet run --project samples/CQRSharp.Sample/CQRSharp.Sample.csproj -c ${{ env.CONFIGURATION }} -f net8.0 --no-build
