name: Validate

# The full gate, shared by CI (every push / pull request) and the release pipeline (which publishes exactly the packages
# this produces). Zero-warning build of every target framework, the whole test suite against a real Redis, coverage,
# the sample as a framework build and as a Native AOT binary, then pack + package validation + a template smoke test.
on:
  workflow_call:

permissions:
  contents: read

env:
  CONFIGURATION: Release
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  PACKAGE_OUTPUT: artifacts/packages
  TEST_RESULTS: artifacts/test-results
  AOT_OUTPUT: artifacts/aot

jobs:
  validate:
    name: Build, test, pack
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # A real Redis, so the CQRSharp.Redis store contract tests run rather than skip.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The libraries multi-target net8.0 / net9.0 / net10.0, but only as far as the installed SDK allows - with the
      # 8.0 SDK alone the packages would silently ship net8.0 only. The newest SDK builds all three; the older
      # entries bring the runtimes the tests run on. validate_packages.py fails the job if a framework is missing.
      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Native AOT prerequisites
        run: |
          missing=""
          command -v clang >/dev/null || missing="${missing} clang"
          [ -f /usr/include/zlib.h ] || missing="${missing} zlib1g-dev"
          if [ -n "${missing}" ]; then
            sudo apt-get update
            sudo apt-get install -y ${missing}
          fi
          clang --version
          dotnet --info

      - name: Restore
        run: dotnet restore CQRSharp.sln

      - name: Build (zero-warning gate)
        # -warnaserror fails the build on ANY warning, so the exit code is the gate. That covers the compiler, the
        # trim/AOT analyzers, undocumented public members, and unrecorded public API changes (PublicAPI.*.txt).
        run: dotnet build CQRSharp.sln -c ${{ env.CONFIGURATION }} --no-restore -p:GeneratePackageOnBuild=false -warnaserror

      - name: Test (net8.0, net9.0, net10.0)
        run: >-
          dotnet test tests/CQRSharp.Tests/CQRSharp.Tests.csproj -c ${{ env.CONFIGURATION }} --no-build
          --logger "trx" --results-directory ${{ env.TEST_RESULTS }}
          --collect "XPlat Code Coverage"
          --blame-hang-timeout 5m --blame-hang-dump-type none

      - name: Coverage summary
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            "-reports:${{ env.TEST_RESULTS }}/**/coverage.cobertura.xml" \
            "-targetdir:artifacts/coverage" \
            "-reporttypes:MarkdownSummaryGithub;Cobertura" \
            "-assemblyfilters:+CQRSharp;+CQRSharp.*;-CQRSharp.Tests;-CQRSharp.Sample*"
          cat artifacts/coverage/SummaryGithub.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ${{ env.TEST_RESULTS }}
            artifacts/coverage

      - name: Run Sample self-test (framework build)
        run: dotnet run --project samples/CQRSharp.Sample/CQRSharp.Sample.csproj -c ${{ env.CONFIGURATION }} -f net8.0 --no-build

      - name: Native AOT publish Sample + run
        run: |
          set -eo pipefail
          case "$(uname -m)" in
            x86_64) rid="linux-x64" ;;
            aarch64|arm64) rid="linux-arm64" ;;
            *) echo "Unsupported runner architecture for Native AOT publish: $(uname -m)"; exit 1 ;;
          esac

          # The per-library trim/AOT analyzers (IsAotCompatible) already gate AOT-hostile code at build under
          # -warnaserror. This is the whole-graph backstop: capture the ILC output and fail loud on any trim/AOT (IL)
          # warning attributed to CQRSharp's own source (the path filter ignores warnings from dependencies).
          publish_log="$(mktemp)"
          dotnet publish samples/CQRSharp.Sample/CQRSharp.Sample.csproj \
            -c "${{ env.CONFIGURATION }}" -f net8.0 -r "${rid}" -o "${{ env.AOT_OUTPUT }}" \
            -p:GeneratePackageOnBuild=false 2>&1 | tee "${publish_log}"

          if grep -nE 'src/CQRSharp[^]]*: warning IL[0-9]{4}' "${publish_log}"; then
            echo "::error::Native AOT publish produced trim/AOT (IL) warnings in CQRSharp source (listed above)."
            exit 1
          fi

          "${{ env.AOT_OUTPUT }}/CQRSharp.Sample"

      - name: Pack
        # Every packable project in the solution; samples and tests are not packable. --no-build: these are the exact
        # binaries that were just tested. Package validation (EnablePackageValidation) runs as part of the pack.
        run: dotnet pack CQRSharp.sln -c ${{ env.CONFIGURATION }} --no-build --no-restore -o "${{ env.PACKAGE_OUTPUT }}"

      - name: Validate package contents
        run: python3 .github/scripts/validate_packages.py "${{ env.PACKAGE_OUTPUT }}"

      - name: Template smoke test (install, scaffold, run against the packed packages)
        run: |
          set -eo pipefail
          feed="$(pwd)/${{ env.PACKAGE_OUTPUT }}"
          work="$(mktemp -d)"

          dotnet new install "${feed}"/CQRSharp.Templates.*.nupkg
          dotnet new cqrsharp -n SmokeApp -o "${work}/SmokeApp"

          cat > "${work}/nuget.config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="packed" value="${feed}" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF

          # An isolated package cache, so a CQRSharp 5.x already in the global cache cannot stand in for the packed one.
          NUGET_PACKAGES="${work}/.packages" dotnet run --project "${work}/SmokeApp" -c Release

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ${{ env.PACKAGE_OUTPUT }}
          if-no-files-found: error
